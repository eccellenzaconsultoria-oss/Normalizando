<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entender para Atender | Valore SGI</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #130D06;
      --navy-mid: #1E1409;
      --gold: #c9a227;
      --gold-light: #e8c84a;
      --green: #1a7a4a;
      --green-light: #e8f7ef;
      --red: #b52f2f;
      --red-light: #fdf0f0;
      --bg: #F5EFE4;
      --card: #ffffff;
      --border: #ddd5c4;
      --text: #1A1208;
      --muted: #7a6a50;
      --step-done: #e8dfc8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── HEADER ─── */
    .app-header {
      background: linear-gradient(90deg,#130D06,#1E1409);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }
    .app-header .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-header .brand-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold);
    }
    .app-header .brand-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .app-header .score-pill {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold-light);
    }

    /* ─── PROGRESS BAR ─── */
    .progress-wrap {
      background: #1E1409;
      padding: 8px 24px 10px;
    }
    .progress-label {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .progress-bar-bg {
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 4px;
      transition: width 0.5s ease;
    }
    .step-dots {
      display: flex;
      gap: 5px;
      margin-top: 6px;
    }
    .step-dot {
      width: 18px; height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      transition: background 0.3s;
    }
    .step-dot.done { background: var(--gold); }
    .step-dot.active { background: rgba(255,255,255,0.6); }

    /* ─── LAYOUT ─── */
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ─── CARD ─── */
    .card {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 28px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(19,33,71,0.07);
    }

    /* ─── INTRO SCREEN ─── */
        .intro-hero {
      background: #0A0603;
      border-radius: 16px;
      padding: 44px 36px 40px;
      text-align: center;
      color: white;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .intro-hero::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(201,162,39,0.08);
    }
    .intro-hero::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -30px;
      width: 250px; height: 250px;
      border-radius: 50%;
      background: rgba(201,162,39,0.06);
    }
    .company-badge {
      display: inline-block;
      background: rgba(201,162,39,0.2);
      border: 1px solid rgba(201,162,39,0.4);
      border-radius: 20px;
      padding: 4px 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 20px;
    }
    .intro-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      font-size: clamp(42px, 8vw, 72px);
      line-height: 1.0;
      letter-spacing: -1px;
      margin-bottom: 12px;
      color: #F5EFE0;
      display: block;
    }
    .intro-title .gold-text {
      background: linear-gradient(135deg,#F0D060 0%,#C9A227 50%,#9A7A10 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .intro-title span { color: var(--gold-light); }
    .intro-subtitle {
      font-size: 15px;
      color: rgba(255,255,255,0.65);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .intro-meta {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .intro-meta-item {
      background: rgba(13,9,6,0.55);
      border: 1px solid rgba(201,162,39,0.35);
      border-radius: 10px;
      padding: 14px 22px;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
    }
    .intro-meta-item strong {
      display: block;
      font-size: 26px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      color: var(--gold-light);
    }
    .btn-primary {
      display: inline-block;
      background: linear-gradient(135deg,#e8c84a 0%,#c9a227 60%,#a07d18 100%);
      color: #0D0906;
      border: none;
      border-radius: 50px;
      padding: 16px 44px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.3px;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg,#f0d060,#e8c84a);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(201,162,39,0.4);
    }
    .intro-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .info-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
    }
    .info-card .info-icon {
      font-size: 22px;
      margin-bottom: 8px;
    }
    .info-card .info-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--navy);
      margin-bottom: 4px;
    }
    .info-card p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ─── BRIEFING ─── */
    .briefing-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .briefing-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg,#130D06,#1E1409);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .briefing-tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 2px;
    }
    .briefing-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--navy);
    }
    .briefing-text {
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--text);
      margin-bottom: 16px;
    }
    .briefing-role {
      background: linear-gradient(135deg,#1E1409,#130D06);
      border-radius: 10px;
      padding: 18px 20px;
      color: white;
      margin-bottom: 20px;
    }
    .briefing-role .role-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 6px;
    }
    .briefing-role p {
      font-size: 14px;
      line-height: 1.65;
      color: rgba(255,255,255,0.88);
      font-style: italic;
    }
    .mechanics-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mechanics-list li {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.5;
    }
    .step-num {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--navy);
      color: white;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ─── SITUATION CARD ─── */
    .situation-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .situation-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .conformity-tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .tag-hidden { display: none; }
    .tag-conforme { background: var(--green-light); color: var(--green); }
    .tag-nao-conforme { background: var(--red-light); color: var(--red); }

    .scenario-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: var(--navy);
      margin-bottom: 12px;
    }
    .scenario-text {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
      border-left: 3px solid var(--gold);
      padding-left: 14px;
    }

    /* ─── STEP CARDS ─── */
    .step-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px;
      margin-bottom: 14px;
    }
    .step-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .step-badge {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--navy);
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-badge.done { background: var(--green); }
    .step-question {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.4;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-btn {
      width: 100%;
      background: #f6f8fd;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .opt-letter {
      min-width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--navy);
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      transition: background 0.2s;
    }
    .opt-text { flex: 1; }
    .option-btn:hover:not(:disabled) {
      border-color: var(--navy);
      background: #eef1f8;
    }
    .option-btn.correct {
      background: var(--green-light);
      border-color: var(--green);
      color: var(--green);
      font-weight: 600;
    }
    .option-btn.correct .opt-letter { background: var(--green); }
    .option-btn.wrong {
      background: var(--red-light);
      border-color: var(--red);
      color: var(--red);
    }
    .option-btn.wrong .opt-letter { background: var(--red); }
    .option-btn:disabled { cursor: default; }

    /* conformidade buttons */
    .conform-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .conform-btn {
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: #f6f8fd;
      font-family: 'DM Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .conform-btn .conf-icon { font-size: 22px; }
    .conform-btn:hover:not(:disabled) { transform: translateY(-2px); }
    .conform-btn.btn-conforme { color: var(--green); }
    .conform-btn.btn-conforme:hover:not(:disabled) { border-color: var(--green); background: var(--green-light); }
    .conform-btn.btn-nc { color: var(--red); }
    .conform-btn.btn-nc:hover:not(:disabled) { border-color: var(--red); background: var(--red-light); }
    .conform-btn.selected-conforme { border-color: var(--green); background: var(--green-light); }
    .conform-btn.selected-nc { border-color: var(--red); background: var(--red-light); }
    .conform-btn:disabled { cursor: default; }

    /* ─── FEEDBACK BOX ─── */
    .feedback-box {
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 13.5px;
      line-height: 1.65;
      margin-top: 12px;
      display: none;
    }
    .feedback-box.show { display: block; }
    .feedback-box.fb-correct {
      background: var(--green-light);
      border: 1px solid #a8d5bc;
      color: #135e35;
    }
    .feedback-box.fb-wrong {
      background: var(--red-light);
      border: 1px solid #e8b4b4;
      color: #8b2020;
    }
    .fb-title {
      font-weight: 700;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .fb-correct-reveal {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(0,0,0,0.08);
      font-size: 13px;
      color: #1a4a2e;
    }

    /* ─── MAIN FEEDBACK (step 3 reveal) ─── */
    .main-feedback {
      background: linear-gradient(135deg,#130D06 0%,#1E1409 100%);
      border-radius: 10px;
      padding: 20px;
      margin-top: 12px;
      display: none;
    }
    .main-feedback.show { display: block; }
    .mf-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .mf-icon { font-size: 24px; }
    .mf-req {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--gold-light);
    }
    .mf-status {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: white;
    }
    .mf-text {
      font-size: 13.5px;
      line-height: 1.7;
      color: rgba(255,255,255,0.88);
    }

    /* ─── NAV BUTTON ─── */
    .nav-btn {
      width: 100%;
      background: #1E1409;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      display: none;
    }
    .nav-btn.show { display: block; }
    .nav-btn:hover { background: var(--navy-mid); transform: translateY(-1px); }

    /* ─── RESULTS ─── */
    .results-hero {
      background: linear-gradient(135deg,#130D06,#1E1409);
      border-radius: 14px;
      padding: 36px;
      text-align: center;
      color: white;
      margin-bottom: 16px;
    }
    .results-badge {
      font-size: 52px;
      margin-bottom: 8px;
    }
    .results-class {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 28px;
      color: var(--gold-light);
      margin-bottom: 4px;
    }
    .results-score-big {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 48px;
      color: white;
      line-height: 1;
    }
    .results-score-label {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }
    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .results-table th {
      background: #130D06;
      color: rgba(255,255,255,0.7);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 10px 12px;
      text-align: left;
    }
    .results-table th:first-child { border-radius: 8px 0 0 0; }
    .results-table th:last-child { border-radius: 0 8px 0 0; text-align: center; }
    .results-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .results-table tr:last-child td { border-bottom: none; }
    .results-table tr:nth-child(even) td { background: #f8f9fc; }
    .check { color: var(--green); font-weight: 700; }
    .cross { color: var(--red); font-weight: 700; }
    .pts-cell { text-align: center; font-weight: 700; color: var(--navy); }
    .req-small { font-size: 11px; color: var(--muted); display: block; }

    .restart-btn {
      display: block;
      width: 100%;
      background: #1E1409;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }
    .restart-btn:hover { background: var(--navy-mid); }

    .score-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .score-bar-label { font-size: 12px; color: var(--muted); width: 110px; }
    .score-bar {
      flex: 1;
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 4px;
    }
    .score-bar-pts {
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      width: 40px;
      text-align: right;
    }


    .crown-brand { position:absolute !important; top:16px !important; left:20px !important; width:72px !important; height:auto !important; mix-blend-mode:screen; opacity:1.0; pointer-events:none; z-index:10; }
    .crown-watermark { position:absolute !important; right:-130px !important; top:-40px !important; width:300px !important; height:auto !important; mix-blend-mode:screen; opacity:0.12; pointer-events:none; z-index:1; }

    @media (max-width: 520px) {
      .card { padding: 18px; }
      .intro-hero { padding: 36px 20px; }
      .conform-btns { grid-template-columns: 1fr 1fr; }
      .results-hero { padding: 24px; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════

const normTexts = {

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function clauseLabel(req) {
  if (req === 'amd1') return '4.1 · Amd. 1:2024';
  return req;
}

function buildStep1Options(sit) {
  const opts = [
    { req: sit.correctReq, correct: true },
    ...sit.step1DistractorReqs.map(r => ({ req: r, correct: false }))
  ];
  return shuffle(opts);
}

function buildStep2Options(sit) {
  const opts = [
    { req: sit.correctReq, correct: true },
    ...sit.step2DistractorReqs.map(r => ({ req: r, correct: false }))
  ];
  return shuffle(opts);
}

function currentSit() {
  return situations[state.situationOrder[state.situationIdx]];
}

function initSituation(playIdx) {
  const sit = situations[state.situationOrder[playIdx]];
  state.currentStep = 1;
  state.stepsDone = [false, false, false];
  state.stepCorrect = [null, null, null];
  state.shuffledStep1 = buildStep1Options(sit);
  state.shuffledStep2 = buildStep2Options(sit);
}

function renderStep1Feedback(sit) {
  const r = state.stepCorrect[0];
  if (r === true) return '<div class="fb-title">✓ Requisito raiz identificado!</div>' + sit.step1FeedbackCorrect;
  if (r === 'yellow') return '<div class="fb-title">~ Requisito relacionado — não é o que vai mais na veia. (+0,5 pt)</div>Você identificou uma NC real aqui — bom raciocínio. Mas há um requisito que vai mais fundo.<div class="fb-correct-reveal"><strong>Requisito raiz:</strong> Cláusula ' + clauseLabel(sit.correctReq) + ' — ' + reqNames[sit.correctReq] + '</div>';
  return '<div class="fb-title">✗ Esse requisito não se aplica a este cenário.</div>' + sit.step1FeedbackWrong + '<div class="fb-correct-reveal"><strong>Requisito raiz:</strong> Cláusula ' + clauseLabel(sit.correctReq) + ' — ' + reqNames[sit.correctReq] + '</div>';

function renderStep2Feedback(sit) {
  const correct = state.stepCorrect[1];
  if (correct) {
    return `<div class="fb-title">✓ Correto!</div>${sit.step2FeedbackCorrect}`;

}

function renderMainFeedback(sit) {
  const correct = state.stepCorrect[2];
  const icon = sit.isConforming ? '✅' : '🔴';

  return `
    <div class="mf-header">

        <div class="mf-req">Cláusula ${sit.correctReq} — ${reqNames[sit.correctReq]}</div>

}

function renderIdentification() {
  const today = new Date();
  const ds = today.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  app.innerHTML = '<div class="app-header"><div class="brand"><div class="brand-dot"></div><div class="brand-name">Entender para Atender · Valore SGI</div></div></div><div class="container"><div class="card"><div class="briefing-header" style="margin-bottom:20px;"><div class="briefing-icon">🎓</div><div><div class="briefing-tag">Antes de começar</div><div class="briefing-title">Identifique-se</div></div></div><p class="briefing-text" style="margin-bottom:20px;">Seus dados serão registrados no relatório de desempenho gerado ao final.</p><div class="id-form"><div class="id-field"><label>Nome completo *</label><input class="id-input" id="inp-name" type="text" placeholder="Ex.: Maria Souza" maxlength="80"></div><div class="id-field"><label>Cargo / Função</label><input class="id-input" id="inp-role" type="text" placeholder="Ex.: Auditora Interna" maxlength="80"></div><div class="id-field"><label>Data</label><input class="id-input" id="inp-date" type="text" value="' + ds + '" readonly></div></div><div style="margin-top:24px;"><button class="btn-primary" style="width:100%;" onclick="startWithIdentification()">Iniciar o simulador →</button><div id="id-error" style="color:var(--red);font-size:13px;margin-top:8px;display:none;">Por favor, informe seu nome para continuar.</div></div></div></div>';
}
function goToIdentification() { state.screen='identification'; render(); }
function startWithIdentification() {
  const name=document.getElementById('inp-name').value.trim();
  const role=document.getElementById('inp-role').value.trim();
  const date=document.getElementById('inp-date').value;
  const err=document.getElementById('id-error');
  if(!name){err.style.display='block';return;}
  err.style.display='none';
  state.studentName=name; state.studentRole=role; state.sessionDate=date;
  state.situationIdx=0; state.score=0; state.results=[];
  state.situationOrder=shuffle(Array.from({length:situations.length},(_,i)=>i)).slice(0,12);
  initSituation(0); state.screen='situation'; render();
}
function goBack() { if(state.situationIdx>0){state.situationIdx--;render();window.scrollTo({top:0,behavior:'smooth'});} }
function goForward() { state.situationIdx++;render();window.scrollTo({top:0,behavior:'smooth'}); }
function renderReview() {
  const i=state.situationIdx, sit=situations[state.situationOrder[i]], res=state.results[i];
  const pct=(i+1)/12*100, sc=Number.isInteger(state.score)?state.score:state.score.toFixed(1);
  const s3ok=sit.isConforming?'Conforme':'Não Conforme', s3ch=res.chosenConforming?'Conforme':'Não Conforme';
  app.innerHTML='<div class="app-header"><div class="brand"><div class="brand-dot"></div><div class="brand-name">Revisão — '+sit.title+'</div></div><div class="score-pill">⭐ '+sc+' / 36 pts</div></div><div class="progress-wrap"><div class="progress-label">Revisando situação '+(i+1)+' de 12</div><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:'+pct+'%"></div></div></div><div class="container"><div class="card"><div class="situation-header"><div class="situation-num">Situação '+(i+1)+' · ISO 14001 / 45001</div><span class="conformity-tag '+(sit.isConforming?'tag-conforme':'tag-nao-conforme')+'">'+(sit.isConforming?'✅ Conforme':'❌ Não Conforme')+'</span></div><div class="scenario-title">'+sit.title+'</div><div class="scenario-text">'+sit.scenario+'</div></div><div class="review-card"><div class="review-step"><div class="review-step-label">Passo 1 — Requisito</div><div class="review-answer '+(res.s1===true?'review-correct':res.s1==='yellow'?'':'review-wrong')+'" style="'+(res.s1==='yellow'?'color:#7a5f00;':'')+'"><span class="review-mark">'+(res.s1===true?'✓':res.s1==='yellow'?'~':'✗')+'</span> Cláusula '+clauseLabel(res.chosenReq)+' — '+(reqNames[res.chosenReq]||'')+'</div>'+(res.s1!==true?'<div class="review-dim">Raiz: Cláusula '+clauseLabel(sit.correctReq)+' — '+reqNames[sit.correctReq]+'</div>':'')+'</div><div class="review-step"><div class="review-step-label">Passo 2 — Texto normativo</div><div class="review-answer '+(res.s2?'review-correct':'review-wrong')+'"><span class="review-mark">'+(res.s2?'✓':'✗')+'</span> '+(res.s2?'Trecho correto':'Trecho incorreto')+'</div>'+(res.s2?'':'<div class="review-dim">Correto: '+normTexts[sit.correctReq]+'</div>')+'</div><div class="review-step"><div class="review-step-label">Passo 3 — Conformidade</div><div class="review-answer '+(res.s3?'review-correct':'review-wrong')+'"><span class="review-mark">'+(res.s3?'✓':'✗')+'</span> '+s3ch+' · Correto: '+s3ok+'</div></div><div style="background:#f6f8fd;border-radius:8px;padding:14px;margin-top:8px;"><div class="review-step-label" style="margin-bottom:6px;">Feedback</div><div style="font-size:13px;line-height:1.7;">'+(res.s3?sit.step3FeedbackCorrect:sit.step3FeedbackWrong)+'</div><div style="margin-top:8px;font-size:12px;font-weight:700;color:var(--navy);">Pontuação: '+(Number.isInteger(res.pts)?res.pts:res.pts.toFixed(1))+'/3</div></div></div><div class="nav-row">'+(i>0?'<button class="btn-back" onclick="goBack()">← Anterior</button>':'')+'<button class="nav-btn show" onclick="goForward()">'+(i+1<state.results.length?'Próxima →':'Voltar à situação atual →')+'</button></div></div>';
}
function goToBriefing() {
  state.screen = 'briefing';
  render();
}

function startSimulation() {
  const BANK = situations.length;   // 26
  const SESSION = 12;
  state.situationIdx = 0;
  state.score = 0;
  state.results = [];
  state.situationOrder = shuffle(Array.from({length: BANK}, (_, i) => i)).slice(0, SESSION);
  initSituation(0);
  state.screen = 'situation';
  render();
}

function handleStep1(optIdx) {
  if (state.stepsDone[0]) return;
  const opt = state.shuffledStep1[optIdx];
  const sit = currentSit();
  const isRoot = opt.correct;
  const isRelated = !isRoot && (sit.relatedStep1Reqs || []).includes(opt.req);
  state.stepsDone[0] = true;
  state.stepCorrect[0] = isRoot ? true : isRelated ? 'yellow' : false;
  if (isRoot) state.score += 1;
  if (isRelated) state.score += 0.5;
  state.lastChosenReq = opt.req;
  state.currentStep = 2;

  // apply visual to buttons
  state.shuffledStep1.forEach((o, i) => {
    const btn = document.getElementById('s1opt' + i);
    if (btn) {
      btn.disabled = true;
      if (o.correct) btn.classList.add('correct');
      else if (i === optIdx && isRelated) btn.classList.add('related');
      else if (i === optIdx) btn.classList.add('wrong');
    }
  });

  const fb = document.getElementById('fb1');
  if (fb) {
    fb.innerHTML = renderStep1Feedback(currentSit());
    fb.className = 'feedback-box show ' + (isRoot ? 'fb-correct' : isRelated ? 'fb-related' : 'fb-wrong');
  }

  const s1badge = document.getElementById('s1badge');
  if (s1badge) { s1badge.textContent = '✓'; s1badge.classList.add('done'); }

  const step2 = document.getElementById('step2-card');
  if (step2) { step2.style.opacity = '1'; step2.style.pointerEvents = 'auto'; }

  const stepDots = document.querySelectorAll('.step-dot');
  if (stepDots.length >= 3) {
    stepDots[0].className = 'step-dot done';
    stepDots[1].className = 'step-dot active';
    stepDots[2].className = 'step-dot';
  }
}

function handleStep2(optIdx) {
  if (state.stepsDone[1]) return;
  const opt = state.shuffledStep2[optIdx];
  const correct = opt.correct;
  state.stepsDone[1] = true;
  state.stepCorrect[1] = correct;
  state.lastChosenNormReq = opt.req;
  if (correct) state.score++;
  state.currentStep = 3;

  // Update button styles
  state.shuffledStep2.forEach((o, i) => {
    const btn = document.getElementById('s2opt' + i);
    if (btn) {
      btn.disabled = true;
      if (o.correct) btn.classList.add('correct');
      else if (i === optIdx && isRelated) btn.classList.add('related');
      else if (i === optIdx) btn.classList.add('wrong');
    }
  });

  // UNLOCK STEP 3 FIRST — before any rendering that might fail
  const s2badge = document.getElementById('s2badge');
  if (s2badge) { s2badge.textContent = '✓'; s2badge.classList.add('done'); }

  const step3 = document.getElementById('step3-card');
  if (step3) {
    step3.style.opacity = '1';
    step3.style.pointerEvents = 'auto';
    step3.style.transition = 'opacity 0.3s';
  }

  const stepDots = document.querySelectorAll('.step-dot');
  if (stepDots.length >= 3) {
    stepDots[0].className = 'step-dot done';
    stepDots[1].className = 'step-dot done';
    stepDots[2].className = 'step-dot active';
  }

  // Render feedback AFTER unlocking step 3 (safe even if it fails)
  try {
    const fb = document.getElementById('fb2');
    if (fb) {
      fb.innerHTML = renderStep2Feedback(currentSit());
      fb.className = 'feedback-box show ' + (isRoot ? 'fb-correct' : isRelated ? 'fb-related' : 'fb-wrong');
    }
  } catch(e) {
    console.warn('Feedback step2 error:', e);
  }
}

function handleStep3(choseConforming) {
  if (state.stepsDone[2]) return;
  const sit = currentSit();
  const correct = choseConforming === sit.isConforming;
  state.stepsDone[2] = true;
  state.stepCorrect[2] = correct;
  state.lastChosenConforming = choseConforming;
  if (correct) state.score++;

  const pts = state.stepCorrect.filter(Boolean).length;

  // update score for THIS situation
  // (already accumulating in state.score across situations)
  // we track per-situation results when next is pressed

  const btnConf = document.getElementById('btn-conf');
  const btnNC = document.getElementById('btn-nc');
  if (btnConf) { btnConf.disabled = true; if (sit.isConforming) btnConf.classList.add('selected-conforme'); }
  if (btnNC) { btnNC.disabled = true; if (!sit.isConforming) btnNC.classList.add('selected-nc'); }

  const mf = document.getElementById('mf');
  if (mf) {
    mf.innerHTML = renderMainFeedback(sit);
    mf.classList.add('show');
  }

  const s3badge = document.getElementById('s3badge');
  if (s3badge) { s3badge.textContent = '✓'; s3badge.classList.add('done'); }

  // show conform tag
  const tag = document.getElementById('conform-tag');
  if (tag) tag.classList.remove('tag-hidden');

  const navBtn = document.getElementById('nav-btn');
  if (navBtn) navBtn.classList.add('show');

  const scoreDisplay = document.querySelector('.score-pill');
  if (scoreDisplay) scoreDisplay.textContent = '⭐ ' + state.score + ' / 36 pts';

  const stepDots = document.querySelectorAll('.step-dot');
  if (stepDots.length >= 3) {
    stepDots[0].className = 'step-dot done';
    stepDots[1].className = 'step-dot done';
    stepDots[2].className = 'step-dot done';
  }
}

function nextSituation() {
  // Save result for this situation
  const sitPts = (state.stepCorrect[0]===true?1:state.stepCorrect[0]==='yellow'?0.5:0)+(state.stepCorrect[1]?1:0)+(state.stepCorrect[2]?1:0);
  state.results.push({s1:state.stepCorrect[0],s2:state.stepCorrect[1],s3:state.stepCorrect[2],pts:sitPts,chosenReq:state.lastChosenReq,chosenNormReq:state.lastChosenNormReq,chosenConforming:state.lastChosenConforming});

  if (state.situationIdx < situations.length - 1) {
    state.situationIdx++;
    initSituation(state.situationIdx);
    state.screen = 'situation';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    state.screen = 'results';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function restartApp() {
  state = {
    screen:'intro', studentName:'', studentRole:'', sessionDate:'',
    situationIdx:0, situationOrder:[], currentStep:1,
    stepsDone:[false,false,false], stepCorrect:[null,null,null],
    lastChosenReq:null, lastChosenNormReq:null, lastChosenConforming:null,
    score:0, results:[], shuffledStep1:[], shuffledStep2:[],
  };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
render();
</script>
